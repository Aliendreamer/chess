# Chess local-dev full stack. Lives under tools/localdev/ — run it with the helper:
#
#   tools/localdev/stack.sh up        # build + start (detached)
#   tools/localdev/stack.sh down      # stop + remove
#
# (or directly: `docker compose -f tools/localdev/docker-compose.yml up --build`)
#
# Everything is reachable on http://*.chess.localhost (browsers auto-resolve *.localhost to
# 127.0.0.1 — no /etc/hosts edits):
#   app.chess.localhost          → frontend (SSR BFF)
#   api.chess.localhost          → backend API (Scalar/Swagger, curl)
#   keycloak.chess.localhost     → Keycloak
#   redisinsight.chess.localhost → RedisInsight
#
# Frontend + backend run with live reload: source is bind-mounted from apps/* and they run in watch
# mode (Vite HMR / `dotnet watch`). First start is slow (in-container restore/install); later starts
# reuse the named caches. Dev secrets are non-sensitive local defaults.
#
# Paths below are relative to THIS file (tools/localdev/): repo-root assets use ../../.

name: chess

services:
  proxy:
    image: traefik:v3.3
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      # File-provider fallback if the docker daemon's min API rejects the docker provider.
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      # Dashboard for local debugging (which routers/services/providers are live).
      # insecure => served on :8080 without auth; localhost-only, dev stack only.
      - --api.dashboard=true
      - --api.insecure=true
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik:/etc/traefik/dynamic:ro
    networks:
      default:
        aliases:
          - app.chess.localhost
          - api.chess.localhost
          - keycloak.chess.localhost
          - redisinsight.chess.localhost
    depends_on:
      - frontend
      - backend
      - keycloak
      - redisinsight

  postgres:
    # Built rather than pulled: the cluster's image is a Postgres 18 base plus pg_cron and pg_partman,
    # matching production's partition lifecycle. See postgres.dev.Dockerfile.
    build:
      context: .
      dockerfile: postgres.dev.Dockerfile
    # pg_cron has to be in shared_preload_libraries to load at all, and it runs its jobs in exactly one
    # database, named here. Without both settings `CREATE EXTENSION pg_cron` fails outright.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_cron
      - -c
      - cron.database_name=chess
    environment:
      POSTGRES_USER: chess
      POSTGRES_PASSWORD: chess
      POSTGRES_DB: chess
    ports:
      # Exposed for local DB tooling (DBeaver, psql). Bound to 127.0.0.1 deliberately: a bare "5432:5432"
      # listens on every interface, and the credentials here are the well-known dev pair, so anything that
      # could reach this machine would have the database. Loopback-only still reaches DBeaver on localhost.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess -d chess"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      # postgres:18+ stores data under a major-version subdir; mount the parent, not /data.
      - pgdata:/var/lib/postgresql

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  redisinsight:
    image: redis/redisinsight:2.70
    volumes:
      - redisinsight:/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.redisinsight.rule=Host(`redisinsight.chess.localhost`)
      - traefik.http.routers.redisinsight.entrypoints=web
      - traefik.http.services.redisinsight.loadbalancer.server.port=5540

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://keycloak.chess.localhost
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.keycloak.rule=Host(`keycloak.chess.localhost`)
      - traefik.http.routers.keycloak.entrypoints=web
      - traefik.http.services.keycloak.loadbalancer.server.port=8080

  # Grants the API's service account the realm-management roles it needs to manage users.
  #
  # This cannot be done declaratively. A `users` entry carrying `clientRoles` and a
  # `serviceAccountClientId` does not attach them to the client's service account: importing the
  # client creates that account itself, and the `users` entry then imports as a SECOND, orphan user
  # of the same name. The roles land on the orphan, the real service account has none, and every
  # /api/users call fails with a 403 from Keycloak. So the entry is gone from the realm JSON and the
  # grant happens here, against the account the client actually owns — looked up by id, since the
  # name alone was exactly what was ambiguous.
  #
  # Runs once per `up` and exits; re-granting an existing role mapping is a no-op, so it is safe to
  # repeat. The backend waits for it to succeed.
  keycloak-init:
    image: quay.io/keycloak/keycloak:26.0
    depends_on:
      keycloak:
        condition: service_started
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        kcadm=/opt/keycloak/bin/kcadm.sh
        realm=chess
        for i in $$(seq 1 60); do
          "$$kcadm" config credentials --server http://keycloak:8080 --realm master \
            --user admin --password admin >/dev/null 2>&1 && break
          sleep 2
        done
        cid=$$("$$kcadm" get clients -r "$$realm" -q clientId=chess_api \
          --fields id --format csv --noquotes)
        said=$$("$$kcadm" get "clients/$$cid/service-account-user" -r "$$realm" \
          --fields id --format csv --noquotes)
        "$$kcadm" add-roles -r "$$realm" --uid "$$said" --cclientid realm-management \
          --rolename manage-users --rolename view-users --rolename query-users
        echo "keycloak-init: granted realm-management roles to service account $$said"
    restart: "no"

  backend:
    build:
      context: ../../apps/backend
      dockerfile: ../../tools/localdev/backend.dev.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      Keycloak__Authority: http://keycloak.chess.localhost/realms/chess
      Keycloak__Audience: ""
      Keycloak__ClientId: chess_api
      Keycloak__ClientSecret: chess-dev-secret
      Keycloak__CallbackUri: http://app.chess.localhost/api/auth/callback
      Keycloak__PostLogoutRedirectUri: http://app.chess.localhost
      Keycloak__AppBaseUrl: http://app.chess.localhost
      SessionCookies__Domain: .chess.localhost
      SessionCookies__SessionName: mp_sid
      SessionCookies__PkceName: mp_pkce
      AllowedCorsOrigins__0: http://app.chess.localhost
      AllowedCorsOrigins__1: http://localhost:3000
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=chess;Username=chess;Password=chess"
      ConnectionStrings__Redis: "redis:6379"
      AppVersionStorage__RootPath: /data/app-versions
    volumes:
      - ../../apps/backend:/src
      # Keep host-built artifacts out of the container (and vice versa).
      - /src/bin
      - /src/obj
      # Persist uploaded app-version artifacts across container restarts.
      - appversions:/data/app-versions
    # The Keycloak issuer URL must resolve identically inside the container and in the browser.
    extra_hosts:
      - "keycloak.chess.localhost:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
      keycloak-init:
        condition: service_completed_successfully
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`api.chess.localhost`)
      - traefik.http.routers.api.entrypoints=web
      - traefik.http.services.api.loadbalancer.server.port=8080

  frontend:
    build:
      context: ../..
      dockerfile: tools/localdev/frontend.dev.Dockerfile
    environment:
      # Server-side only; never exposed to the client bundle. The SSR server is the BFF.
      API_URL: http://backend:8080
      # IdP public origin, added to the CSP `form-action` so the logout form's redirect to
      # Keycloak's end-session endpoint is not blocked (browsers enforce form-action across redirects).
      KEYCLOAK_ORIGIN: http://keycloak.chess.localhost
      DOCKER_DEV: "1"
    volumes:
      - ../../apps/frontend:/app/apps/frontend
      - ../../package.json:/app/package.json
      - ../../pnpm-lock.yaml:/app/pnpm-lock.yaml
      - ../../pnpm-workspace.yaml:/app/pnpm-workspace.yaml
      - ../../.npmrc:/app/.npmrc
      # Keep node_modules in the container (don't let the host's shadow it).
      - /app/node_modules
      - /app/apps/frontend/node_modules
    depends_on:
      - backend
    labels:
      - traefik.enable=true
      - traefik.http.routers.app.rule=Host(`app.chess.localhost`)
      - traefik.http.routers.app.entrypoints=web
      - traefik.http.services.app.loadbalancer.server.port=3000

volumes:
  pgdata:
  redisdata:
  redisinsight:
  appversions:

networks:
  default:
    name: chess
