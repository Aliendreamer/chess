# Chess local-dev full stack. Lives under tools/localdev/ — run it with the helper:
#
#   tools/localdev/stack.sh up        # build + start (detached)
#   tools/localdev/stack.sh down      # stop + remove
#
# (or directly: `docker compose -f tools/localdev/docker-compose.yml up --build`)
#
# Everything is reachable on http://*.chess.localhost (browsers auto-resolve *.localhost to
# 127.0.0.1 — no /etc/hosts edits):
#   app.chess.localhost          → frontend (SSR BFF)
#   api.chess.localhost          → backend API (Scalar/Swagger, curl)
#   keycloak.chess.localhost     → Keycloak
#   redisinsight.chess.localhost → RedisInsight
#   console.chess.localhost      → Redpanda Console (topics, consumer groups, messages)
#   grafana.chess.localhost      → Grafana: metrics, traces, logs, profiles (admin/Admin123!, viewer/Viewer123!)
#
# Data plane (ROADMAP.md): Postgres PRIMARY (writes) → streaming replication → Postgres REPLICA (reads);
# Redpanda (Kafka API) is the event backbone. Both are here so the monorepo is self-contained.
#
# Frontend + backend run with live reload: source is bind-mounted from apps/* and they run in watch
# mode (Vite HMR / `dotnet watch`). First start is slow (in-container restore/install); later starts
# reuse the named caches. Dev secrets are non-sensitive local defaults.
#
# Paths below are relative to THIS file (tools/localdev/): repo-root assets use ../../.
#
# `cluster` profile (`docker compose --profile cluster up`): adds `backend-2`, a second Akka cluster
# node sharing the same DB/Kafka/Keycloak, so cluster behavior (sharding, failover) is exercisable
# without a second host. `backend` and `backend-2` share their environment via the `x-backend-env`
# anchor below so the two cannot drift; each overrides only its own `Akka__Hostname`/seed list.

name: chess

# Shared env for every backend node (compose extension field + YAML anchor). Akka__Hostname and the
# Akka__SeedNodes__* entries are per-node and are set explicitly on each service instead.
x-backend-env: &backend-env
  ASPNETCORE_ENVIRONMENT: Development
  ASPNETCORE_HTTP_PORTS: "8080"
  Keycloak__Authority: http://keycloak.chess.localhost/realms/chess
  Keycloak__Audience: chess_api
  Keycloak__ClientId: chess_api
  Keycloak__ClientSecret: chess-dev-secret
  Keycloak__CallbackUri: http://app.chess.localhost/api/auth/callback
  Keycloak__PostLogoutRedirectUri: http://app.chess.localhost
  Keycloak__AppBaseUrl: http://app.chess.localhost
  SessionCookies__Domain: .chess.localhost
  SessionCookies__SessionName: mp_sid
  SessionCookies__PkceName: mp_pkce
  SessionStore__CleanupInterval: "00:05:00"
  ForwardedHeaders__KnownNetworks__0: 172.30.0.0/24
  AllowedCorsOrigins__0: http://app.chess.localhost
  AllowedCorsOrigins__1: http://localhost:3000
  ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=chess;Username=chess;Password=chess"
  # Read side (ROADMAP D1): every query goes to the hot standby.
  ConnectionStrings__PostgresReplica: "Host=postgres-replica;Port=5432;Database=chess;Username=chess;Password=chess"
  ConnectionStrings__Redis: "redis:6379"
  Kafka__BootstrapServers: "redpanda:9092"
  Akka__Port: "8091"
  # Correspondence mail (correspondence-games D4) goes to Mailpit, which keeps it: nothing leaves the machine.
  Smtp__Host: mailpit
  Smtp__Port: "1025"
  Smtp__From: chess@chess.localhost
  # Traces, metrics and logs over OTLP to the collector (observability D2); the node name comes from Akka__Hostname.
  Observability__Enabled: "true"
  Observability__OtlpEndpoint: http://otel-collector:4317

# Every service logs through json-file with its container name as the tag (chess-keycloak-1); the collector reads
# these files and turns the tag into the service name in Loki (observability D9). Size-capped so logs never fill the disk.
x-logging: &default-logging
  driver: json-file
  options:
    tag: "{{.Name}}"
    max-size: "10m"
    max-file: "3"

services:
  proxy:
    logging: *default-logging
    image: traefik:v3.3
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      # File-provider fallback if the docker daemon's min API rejects the docker provider.
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      # Dashboard for local debugging (which routers/services/providers are live).
      # insecure => served on :8080 without auth; localhost-only, dev stack only.
      - --api.dashboard=true
      - --api.insecure=true
    ports:
      - "80:80"
      # Dashboard, loopback-only. 8080 is a popular port on dev machines, so it is overridable:
      #   TRAEFIK_DASHBOARD_PORT=9090 tools/localdev/stack.sh up
      - "127.0.0.1:${TRAEFIK_DASHBOARD_PORT:-8090}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik:/etc/traefik/dynamic:ro
    networks:
      default:
        aliases:
          - app.chess.localhost
          - api.chess.localhost
          - keycloak.chess.localhost
          - redisinsight.chess.localhost
          - console.chess.localhost
    depends_on:
      - frontend
      - backend
      - keycloak
      - redisinsight

  postgres:
    logging: *default-logging
    # Built rather than pulled: the cluster's image is a Postgres 18 base plus pg_cron and pg_partman,
    # matching production's partition lifecycle. See postgres.dev.Dockerfile.
    build:
      context: .
      dockerfile: postgres.dev.Dockerfile
    # pg_cron has to be in shared_preload_libraries to load at all, and it runs its jobs in exactly one
    # database, named here. Without both settings `CREATE EXTENSION pg_cron` fails outright.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_cron
      - -c
      - cron.database_name=chess
      # Drop a vanished client's session within ~30s (15s idle + 3 probes x 5s) instead of the kernel's ~2h,
      # so the journal publisher's advisory lock is released when its holder dies without closing the socket.
      # tcp_user_timeout covers the case keepalives don't: unacked data already in flight.
      - -c
      - tcp_keepalives_idle=15
      - -c
      - tcp_keepalives_interval=5
      - -c
      - tcp_keepalives_count=3
      - -c
      - tcp_user_timeout=30000
    environment:
      POSTGRES_USER: chess
      POSTGRES_PASSWORD: chess
      POSTGRES_DB: chess
    volumes:
      # Runs once at initdb: replication role + pg_hba entry for the replica.
      - ./postgres/primary-init-replication.sh:/docker-entrypoint-initdb.d/01-replication.sh:ro
      # postgres:18+ stores data under a major-version subdir; mount the parent, not /data.
      - pgdata:/var/lib/postgresql
    ports:
      # Exposed for local DB tooling (DBeaver, psql). Bound to 127.0.0.1 deliberately: a bare "5432:5432"
      # listens on every interface, and the credentials here are the well-known dev pair, so anything that
      # could reach this machine would have the database. Loopback-only still reaches DBeaver on localhost.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess -d chess"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Hot standby seeded from the primary (see postgres/replica-entrypoint.sh). Every read path in the
  # backend uses THIS node (ConnectionStrings__PostgresReplica); writes never touch it.
  postgres-replica:
    logging: *default-logging
    build:
      context: .
      dockerfile: postgres.dev.Dockerfile
    entrypoint: ["/bin/bash", "/replica-entrypoint.sh"]
    command:
      - -c
      - shared_preload_libraries=pg_cron
      - -c
      - cron.database_name=chess
    environment:
      POSTGRES_USER: chess
      POSTGRES_PASSWORD: chess
      POSTGRES_DB: chess
      PRIMARY_HOST: postgres
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess -d chess"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ./postgres/replica-entrypoint.sh:/replica-entrypoint.sh:ro
      - pgdata_replica:/var/lib/postgresql
    depends_on:
      postgres:
        condition: service_healthy

  # Kafka-API event backbone (ROADMAP D4: Redpanda only). Internal listener for the backend, an external
  # one on loopback for host tools (rpk/kcat: 127.0.0.1:19092).
  redpanda:
    logging: *default-logging
    image: redpandadata/redpanda:v26.2.3
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://127.0.0.1:19092
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://127.0.0.1:18082
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "127.0.0.1:19092:19092"
      - "127.0.0.1:18081:18081"
      - "127.0.0.1:18082:18082"
      - "127.0.0.1:9644:9644"
    volumes:
      - redpanda:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:\\s+true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: the topics from ROADMAP D8 exist before anything produces (no auto-create reliance).
  redpanda-init:
    logging: *default-logging
    image: redpandadata/redpanda:v26.2.3
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        existing="$$(rpk topic list -X brokers=redpanda:9092 | awk 'NR>1 {print $$1}')"
        for t in game.events matchmaking.events analysis.requests analysis.results engine.moves.requests engine.moves.results; do
          if grep -qx "$$t" <<<"$$existing"; then echo "topic $$t exists"; continue; fi
          rpk topic create "$$t" -X brokers=redpanda:9092 --partitions 3 --replicas 1
        done
        # Consumer lag per group as a metric (redpanda_kafka_consumer_group_lag_sum/_max) for Grafana's Event pipeline
        # dashboard (observability D8); off by default in Redpanda.
        rpk cluster config set enable_consumer_group_metrics '["group","partition","consumer_lag"]' -X admin.hosts=redpanda:9644
    restart: "no"

  # Stockfish behind Kafka (engine-play D1): reads engine.moves.requests, answers on engine.moves.results. Its own
  # container so a search never competes with the game actors' clocks for CPU. Needs the Stockfish archive in
  # apps/engine/stockfish/ (git-ignored).
  engine:
    logging: *default-logging
    build:
      context: ../../apps/engine
      dockerfile: Dockerfile
    environment:
      Kafka__BootstrapServers: "redpanda:9092"
      Engine__Processes: "1"
    cpus: 2
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
    restart: unless-stopped

  redpanda-console:
    logging: *default-logging
    image: redpandadata/console:v3.12.0
    environment:
      KAFKA_BROKERS: redpanda:9092
      SCHEMAREGISTRY_ENABLED: "true"
      SCHEMAREGISTRY_URLS: http://redpanda:8081
    depends_on:
      redpanda:
        condition: service_healthy

  redis:
    logging: *default-logging
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  # Local mail catcher (correspondence-games D6): SMTP on 1025 for the backend, the inbox at mail.chess.localhost.
  mailpit:
    logging: *default-logging
    image: axllent/mailpit:v1.31.3
    labels:
      - traefik.enable=true
      - traefik.http.routers.mailpit.rule=Host(`mail.chess.localhost`)
      - traefik.http.routers.mailpit.entrypoints=web
      - traefik.http.services.mailpit.loadbalancer.server.port=8025

  redisinsight:
    logging: *default-logging
    image: redis/redisinsight:2.70
    volumes:
      - redisinsight:/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.redisinsight.rule=Host(`redisinsight.chess.localhost`)
      - traefik.http.routers.redisinsight.entrypoints=web
      - traefik.http.services.redisinsight.loadbalancer.server.port=5540

  keycloak:
    logging: *default-logging
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://keycloak.chess.localhost
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.keycloak.rule=Host(`keycloak.chess.localhost`)
      - traefik.http.routers.keycloak.entrypoints=web
      - traefik.http.services.keycloak.loadbalancer.server.port=8080

  # Grants the API's service account the realm-management roles it needs to manage users.
  #
  # This cannot be done declaratively. A `users` entry carrying `clientRoles` and a
  # `serviceAccountClientId` does not attach them to the client's service account: importing the
  # client creates that account itself, and the `users` entry then imports as a SECOND, orphan user
  # of the same name. The roles land on the orphan, the real service account has none, and every
  # /api/users call fails with a 403 from Keycloak. So the entry is gone from the realm JSON and the
  # grant happens here, against the account the client actually owns — looked up by id, since the
  # name alone was exactly what was ambiguous.
  #
  # Runs once per `up` and exits; re-granting an existing role mapping is a no-op, so it is safe to
  # repeat. The backend waits for it to succeed.
  keycloak-init:
    logging: *default-logging
    image: quay.io/keycloak/keycloak:26.0
    depends_on:
      keycloak:
        condition: service_started
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        kcadm=/opt/keycloak/bin/kcadm.sh
        realm=chess
        for i in $$(seq 1 60); do
          "$$kcadm" config credentials --server http://keycloak:8080 --realm master \
            --user admin --password admin >/dev/null 2>&1 && break
          sleep 2
        done
        cid=$$("$$kcadm" get clients -r "$$realm" -q clientId=chess_api \
          --fields id --format csv --noquotes)
        said=$$("$$kcadm" get "clients/$$cid/service-account-user" -r "$$realm" \
          --fields id --format csv --noquotes)
        "$$kcadm" add-roles -r "$$realm" --uid "$$said" --cclientid realm-management \
          --rolename manage-users --rolename view-users --rolename query-users
        echo "keycloak-init: granted realm-management roles to service account $$said"
    restart: "no"

  backend:
    logging: *default-logging
    build:
      context: ../../apps/backend
      dockerfile: ../../tools/localdev/backend.dev.Dockerfile
    environment:
      <<: *backend-env
      Akka__Hostname: backend
      Akka__SeedNodes__0: akka.tcp://chess@backend:8091
      # backend-2 as a second seed: a RESTARTED backend-1 asks it first and rejoins the running cluster.
      # With itself as the only seed it self-joined into a second cluster (split brain: two shard
      # coordinators, 504s for entities on "the other" side). Without the cluster profile the lookup
      # just times out (seed-node-timeout) and the node self-joins as before.
      Akka__SeedNodes__1: akka.tcp://chess@backend-2:8091
    volumes:
      - ../../apps/backend:/src
      # Keep host-built artifacts out of the container (and vice versa).
      - /src/bin
      - /src/obj
    # The Keycloak issuer URL must resolve identically inside the container and in the browser.
    extra_hosts:
      - "keycloak.chess.localhost:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-replica:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
      keycloak-init:
        condition: service_completed_successfully
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`api.chess.localhost`)
      - traefik.http.routers.api.entrypoints=web
      - traefik.http.services.api.loadbalancer.server.port=8080

  # Second cluster node — `docker compose --profile cluster up`. Same image/env; different Akka
  # hostname. Joins the cluster through `backend`'s seed node.
  backend-2:
    logging: *default-logging
    profiles: ["cluster"]
    build:
      context: ../../apps/backend
      dockerfile: ../../tools/localdev/backend.dev.Dockerfile
    environment:
      <<: *backend-env
      Akka__Hostname: backend-2
      Akka__SeedNodes__0: akka.tcp://chess@backend:8091
      Akka__SeedNodes__1: akka.tcp://chess@backend-2:8091
    volumes:
      - ../../apps/backend:/src
      - /src/bin
      - /src/obj
    extra_hosts:
      - "keycloak.chess.localhost:host-gateway"
    depends_on:
      backend:
        condition: service_started

  frontend:
    logging: *default-logging
    build:
      context: ../..
      dockerfile: tools/localdev/frontend.dev.Dockerfile
    environment:
      # Server-side only; never exposed to the client bundle. The SSR server is the BFF.
      API_URL: http://backend:8080
      # IdP public origin, added to the CSP `form-action` so the logout form's redirect to
      # Keycloak's end-session endpoint is not blocked (browsers enforce form-action across redirects).
      KEYCLOAK_ORIGIN: http://keycloak.chess.localhost
      # The live relay's service identity (chess_bff, realm role Relay). The token URL is the PUBLIC issuer so
      # `iss` matches the backend's Keycloak:Authority; extra_hosts below makes the name resolve in here.
      KEYCLOAK_TOKEN_URL: http://keycloak.chess.localhost/realms/chess/protocol/openid-connect/token
      RELAY_CLIENT_ID: chess_bff
      RELAY_CLIENT_SECRET: chess-bff-dev-secret
      DOCKER_DEV: "1"
    volumes:
      - ../../apps/frontend:/app/apps/frontend
      - ../../package.json:/app/package.json
      - ../../pnpm-lock.yaml:/app/pnpm-lock.yaml
      - ../../pnpm-workspace.yaml:/app/pnpm-workspace.yaml
      - ../../.npmrc:/app/.npmrc
      # Keep node_modules in the container (don't let the host's shadow it).
      - /app/node_modules
      - /app/apps/frontend/node_modules
    extra_hosts:
      - "keycloak.chess.localhost:host-gateway"
    depends_on:
      - backend
    labels:
      - traefik.enable=true
      - traefik.http.routers.app.rule=Host(`app.chess.localhost`)
      - traefik.http.routers.app.entrypoints=web
      - traefik.http.services.app.loadbalancer.server.port=3000

  # ---- observability (observability change): OTel Collector → Prometheus / Tempo / Loki, Pyroscope, Grafana ----
  # Every app sends OTLP to the collector; Grafana (grafana.chess.localhost, admin/Admin123!, viewer/Viewer123!) reads
  # all four stores. Configuration lives in observability/.

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    logging: *default-logging
    command: ["--config=/etc/otelcol/config.yml"]
    # Root only to read Docker's container log files (root:root 0640) for Loki.
    user: "0"
    mem_limit: 512m
    volumes:
      - ./observability/otel-collector.yml:/etc/otelcol/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - otelcol:/var/lib/otelcol
    depends_on:
      - tempo
      - loki
      - prometheus

  prometheus:
    image: prom/prometheus:v3.15.0
    logging: *default-logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-otlp-receiver
      - --web.enable-remote-write-receiver
    mem_limit: 768m
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus

  tempo:
    image: grafana/tempo:2.10.8
    logging: *default-logging
    command: ["-config.file=/etc/tempo.yml"]
    user: "0"
    mem_limit: 768m
    volumes:
      - ./observability/tempo.yml:/etc/tempo.yml:ro
      - tempo:/var/tempo

  loki:
    image: grafana/loki:3.7.8
    logging: *default-logging
    command: ["-config.file=/etc/loki/loki.yml"]
    user: "0"
    mem_limit: 512m
    volumes:
      - ./observability/loki.yml:/etc/loki/loki.yml:ro
      - loki:/loki

  pyroscope:
    image: grafana/pyroscope:2.3.1
    logging: *default-logging
    # Data under /data (the image's working directory is /); profiles kept 72 h (observability D12).
    command:
      [
        "-config.file=/etc/pyroscope/config.yaml",
        "-retention-period=72h",
        "-compactor.blocks-retention-period=72h",
      ]
    user: "0"
    mem_limit: 768m
    volumes:
      - pyroscope:/data

  grafana:
    image: grafana/grafana:13.2.2
    logging: *default-logging
    environment:
      GF_SERVER_ROOT_URL: http://grafana.chess.localhost
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: Admin123!
      # No anonymous access (owner decision 9): admin edits, viewer (made by grafana-init) only looks.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    mem_limit: 384m
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo
      - loki
      - pyroscope

  # Creates the read-only `viewer` account through Grafana's API (the keycloak-init pattern). Re-running it finds the
  # user already there (412) and succeeds.
  grafana-init:
    image: curlimages/curl:8.16.0
    logging: *default-logging
    depends_on:
      - grafana
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        for i in $$(seq 1 60); do
          curl -fsS -o /dev/null http://grafana:3000/api/health && break
          sleep 2
        done
        code=$$(curl -sS -o /tmp/out -w '%{http_code}' -u 'admin:Admin123!' -H 'content-type: application/json' \
          -d '{"name":"Viewer","login":"viewer","email":"viewer@chess.localhost","password":"Viewer123!"}' \
          http://grafana:3000/api/admin/users)
        case "$$code" in
          200) echo "grafana-init: created viewer" ;;
          412) echo "grafana-init: viewer already exists" ;;
          *) echo "grafana-init: HTTP $$code"; cat /tmp/out; exit 1 ;;
        esac
    restart: "no"

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    logging: *default-logging
    environment:
      DATA_SOURCE_NAME: "postgresql://chess:chess@postgres:5432/chess?sslmode=disable"
    mem_limit: 64m
    depends_on:
      postgres:
        condition: service_healthy

  postgres-replica-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    logging: *default-logging
    environment:
      DATA_SOURCE_NAME: "postgresql://chess:chess@postgres-replica:5432/chess?sslmode=disable"
    mem_limit: 64m
    depends_on:
      postgres-replica:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.92.1
    logging: *default-logging
    environment:
      REDIS_ADDR: redis://redis:6379
    mem_limit: 64m
    depends_on:
      redis:
        condition: service_healthy

  # Memory and CPU per container (Runtime & containers dashboard).
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    logging: *default-logging
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service
    privileged: true
    devices:
      - /dev/kmsg
    mem_limit: 256m
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

volumes:
  pgdata:
  pgdata_replica:
  redpanda:
  redisdata:
  redisinsight:
  otelcol:
  prometheus:
  tempo:
  loki:
  pyroscope:
  grafana:

networks:
  default:
    name: chess
    # Fixed subnet so the backend can trust X-Forwarded-* from exactly this network (ForwardedHeaders__KnownNetworks__0).
    ipam:
      config:
        - subnet: 172.30.0.0/24
