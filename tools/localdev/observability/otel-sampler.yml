# A sampler of the sampling setup (tail-sampling D1–D3), merged over otel-connectors.yml. It receives whole traces from
# the gateway (routed by trace id), derives span metrics and the service graph from every span, then keeps a trace
# only if one of the policies below says so, and sends what it keeps to Tempo.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

connectors:
  # Hands every span on from the counting pipeline to the sampling one.
  forward: {}

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  batch: {}
  # A trace is kept when ANY policy matches (tail-sampling D1). "Slow" is judged per operation, never on the whole
  # trace: a move against the engine takes its think time (5–10 s) and the consumers run later, by design. The engine
  # worker is excluded from every slow rule by name, whatever its spans' kind: its time IS the think time.
  tail_sampling:
    decision_wait: 10s
    num_traces: 50000
    expected_new_traces_per_sec: 100
    policies:
      - name: errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      # A person waits on these: an API endpoint, a BFF page or server function. Commands answer in tens of ms.
      # A WebSocket upgrade (101) lasts as long as the socket, so it is not a slow request.
      - name: slow-requests
        type: ottl_condition
        ottl_condition:
          error_mode: ignore
          span:
            - kind == SPAN_KIND_SERVER and end_time_unix_nano - start_time_unix_nano > 1000000000 and attributes["http.response.status_code"] != 101 and attributes["http.status_code"] != 101 and resource.attributes["service.name"] != "chess-engine"
      # One actor message is handled synchronously; a persist, the slowest part, takes ~10 ms.
      - name: slow-actor-messages
        type: ottl_condition
        ottl_condition:
          error_mode: ignore
          span:
            - attributes["actor.type"] != nil and end_time_unix_nano - start_time_unix_nano > 500000000 and resource.attributes["service.name"] != "chess-engine"
      # One Kafka record for one projection, retries included (backoff 200 ms, doubling): over 2 s means retries.
      - name: slow-projection-records
        type: ottl_condition
        ottl_condition:
          error_mode: ignore
          span:
            - IsMatch(name, "^consume ") and end_time_unix_nano - start_time_unix_nano > 2000000000 and resource.attributes["service.name"] != "chess-engine"
      - name: sample-the-rest
        type: probabilistic
        probabilistic:
          sampling_percentage: 10

exporters:
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlp_http/prometheus:
    endpoint: http://prometheus:9090/api/v1/otlp

service:
  extensions: [health_check]
  pipelines:
    traces/in:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [span_metrics, service_graph, forward]
    traces/sampled:
      receivers: [forward]
      processors: [tail_sampling, batch]
      exporters: [otlp_grpc/tempo]
    metrics/derived:
      receivers: [span_metrics, service_graph]
      processors: [batch]
      exporters: [otlp_http/prometheus]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
