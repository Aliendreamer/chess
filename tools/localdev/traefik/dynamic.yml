# Traefik FILE provider routes for the local stack.
#
# The compose services also carry docker labels for the same routes, but Traefik's docker provider needs
# a daemon that still accepts API 1.24; Docker 29+ (min API 1.40) rejects it and the labels are inert.
# This file is the fallback the compose `proxy` service watches; it defines the same routes by hand.
# Upstreams are compose service names on the `chess` network.
#
# `api`'s second server (`backend-2`) only exists under the compose `cluster` profile
# (`docker compose --profile cluster up`); its `healthCheck` drops that server from rotation when
# `backend-2` is absent or unhealthy, instead of serving 502s for it.
http:
  routers:
    app:
      rule: Host(`app.chess.localhost`)
      entryPoints: [web]
      service: app
    api:
      rule: Host(`api.chess.localhost`)
      entryPoints: [web]
      service: api
    keycloak:
      rule: Host(`keycloak.chess.localhost`)
      entryPoints: [web]
      service: keycloak
    redisinsight:
      rule: Host(`redisinsight.chess.localhost`)
      entryPoints: [web]
      service: redisinsight
    console:
      rule: Host(`console.chess.localhost`)
      entryPoints: [web]
      service: console
  services:
    app:
      loadBalancer:
        servers:
          - url: http://frontend:3000
    api:
      loadBalancer:
        servers:
          - url: http://backend:8080
          - url: http://backend-2:8080
        healthCheck:
          path: /health
          interval: 5s
    keycloak:
      loadBalancer:
        servers:
          - url: http://keycloak:8080
    redisinsight:
      loadBalancer:
        servers:
          - url: http://redisinsight:5540
    console:
      loadBalancer:
        servers:
          - url: http://redpanda-console:8080
