worker_processes auto;
error_log /var/log/nginx/error.log crit;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
    accept_mutex off;
}

http {
    # The edge (Traefik) terminates TLS and forwards over HTTP; default to https since it is the only way in.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      https;
    }

    # HSTS only over HTTPS; nginx omits an add_header whose value is empty.
    map $forwarded_proto $hsts_value {
        https   "max-age=31536000; includeSubDomains";
        default "";
    }

    log_format container
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" '
        'xff="$http_x_forwarded_for" '
        'rt=$request_time '
        'uct="$upstream_connect_time" '
        'uht="$upstream_header_time" '
        'urt="$upstream_response_time" '
        '$request_method $uri$is_args$args';

    access_log /dev/stdout container;

    client_body_buffer_size       10K;
    client_header_buffer_size     1k;
    client_max_body_size          8m;
    large_client_header_buffers   4 4k;
    client_body_timeout           12;
    client_header_timeout         12;
    keepalive_timeout             15;
    send_timeout                  10;
    server_tokens                 off;

    proxy_send_timeout            24;
    proxy_read_timeout            24;
    proxy_connect_timeout         20;
    proxy_buffer_size             16k;
    proxy_buffers                 16 16k;
    proxy_busy_buffers_size       32k;

    tcp_nodelay on;

    # Single public origin, so no CORS layer and no cookie re-homing. X-Real-IP is the edge, not the
    # client; for the real client IP, enable realip with the edge network as trusted.
    proxy_set_header X-Forwarded-Proto  $forwarded_proto;
    proxy_set_header X-Forwarded-Host   $host;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header Host               $host;

    server {
        listen 8080 reuseport;

        proxy_http_version 1.1;

        # Docker's embedded DNS. Upstreams are set as variables so nginx resolves them per request
        # (respecting `valid=`) instead of once at startup: the config passes `nginx -t` outside the
        # network, and a restarted/re-IP'd service does not require a proxy restart.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend  http://chess-backend:8080;
        set $frontend http://chess-frontend:3000;

        # No CSP here on purpose: the SSR layer owns it, because only it knows the per-request nonce.
        # A second edge-level CSP would be a policy the browser must ALSO satisfy.
        add_header X-Content-Type-Options   "nosniff" always;
        add_header X-Frame-Options          "DENY" always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security $hsts_value always;

        gzip on;
        gzip_comp_level 1;
        gzip_vary on;
        gzip_min_length 10240;
        gzip_proxied expired no-cache no-store private auth;

        gzip_types
            text/plain
            text/css
            text/xml
            text/javascript
            application/javascript
            application/json
            application/xml
            image/svg+xml;

        # Readiness/liveness probe. Served locally, never proxied.
        location = /hc {
            access_log off;

            return 200;
        }

        # Upstreams are Docker service names (compose / swarm) on the shared network. Add exact-match
        # or unbuffered locations above this one for oversized endpoints.
        location /api/ {
            proxy_pass $backend;
        }

        # Everything else — the SSR frontend (BFF).
        location / {
            proxy_pass $frontend;
        }
    }
}
