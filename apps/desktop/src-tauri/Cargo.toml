[package]
name = "chess-desktop"
# The bundle's version is apps/desktop/package.json's (tauri.conf.json reads it); this one is not released.
version = "0.0.0"
description = "The standalone chess app for one player"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "chess_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
tauri-plugin-sql = { version = "=2.5.0", features = ["sqlite"] }
tauri-plugin-shell = "=2.4.0"
tauri-plugin-http = "=2.8.0"
tauri-plugin-dialog = "=2.8.1"
tauri-plugin-fs = "=2.6.0"
tauri-plugin-opener = "=2.7.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
